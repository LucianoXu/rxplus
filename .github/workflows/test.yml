name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install "ruff==0.15.2"  # keep in step with .pre-commit-config.yaml

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint check
        run: ruff check .

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies for audio
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev

      - name: Install package with all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run mypy
        run: mypy rxplus

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies for audio
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev

      - name: Install package with all dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest -v --tb=long 2>&1 | tee test-output.txt

      - name: Upload test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-py${{ matrix.python-version }}
          path: test-output.txt

  test-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install basic package only
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run basic tests
        run: pytest -v --tb=short --ignore=tests/test_audio.py --ignore=tests/test_graphic.py

  test-free-threaded:
    # rxplus.reacting is shared by many caller threads and two of its own:
    # run it without the GIL, where races show up (review of #22).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14t
        uses: actions/setup-python@v5
        with:
          python-version: "3.14t"

      - name: Install the package and what the reacting tests import
        # Not the full dependency list: opentelemetry-exporter-otlp pulls
        # grpcio, which has no free-threaded wheel (a long source build), and
        # these tests never load it.
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest mypy websockets reactivex attrs opentelemetry-sdk prompt-toolkit

      - name: Run the reacting tests without the GIL
        env:
          PYTHON_GIL: "0"
        run: |
          python -c "import sys; assert not sys._is_gil_enabled()"
          pytest -v --tb=short tests/reacting tests/conformance
